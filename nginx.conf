# TLS proxy for Bedrock NetherNet signaling (TCP 19132).
# Clients (iOS in particular) require TLS with a publicly trusted certificate here;
# the Bedrock server itself only speaks plain HTTP on this port.
# Game traffic (UDP) does not pass through nginx.

events {
    worker_connections 1024;
}

stream {
    server {
        listen 19132 ssl;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_alpn            http/1.1;

        # Compose service name of the Bedrock server
        proxy_pass bedrock-vanilla:19132;
    }
}
