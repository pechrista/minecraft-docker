# your minecraft server name
name: minecraft-server

services:
  bedrock-vanilla:
    image: ghcr.io/pechrista/minecraft-bedrock:latest
    container_name: ${COMPOSE_PROJECT_NAME}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "19132:19132/udp"
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/bedrock
    # Override any server.properties value with MC_<KEY> (uppercase, '-' -> '_').
    # Unset keys keep their server.properties value. Uncomment and edit as needed.
    # environment:
    #   - MC_SERVER_NAME=My Server
    #   - MC_LEVEL_NAME=Bedrock level
    #   - MC_LEVEL_SEED=
    #   - MC_GAMEMODE=survival
    #   - MC_DIFFICULTY=easy
    #   - MC_ALLOW_CHEATS=false
    #   - MC_MAX_PLAYERS=10
    #   - MC_ONLINE_MODE=true
    #   - MC_ALLOW_LIST=false
    #   - MC_VIEW_DISTANCE=32
    #   - MC_TICK_DISTANCE=4
    #   - MC_DEFAULT_PLAYER_PERMISSION_LEVEL=member

  bedrock-backup:
    image: ghcr.io/pechrista/minecraft-bedrock-backup:latest
    container_name: ${COMPOSE_PROJECT_NAME}-backup
    pull_policy: always
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/bedrock_data:ro
      - ./backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/New_York
      - BACKUP_CRON=0 4 * * *
      - MAX_BACKUPS=10